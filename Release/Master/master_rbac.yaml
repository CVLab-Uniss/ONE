# Questo file definisce i permessi (Role) e li assegna (RoleBinding)
# al ServiceAccount predefinito nel namespace 'dev',
# in modo che il Master Node possa creare nuove risorse Slave.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: master-node-deployment-creator
  namespace: dev # IMPORTANTE: Assicurati che sia il namespace corretto (dev)
rules:
- apiGroups: ["apps"] # Permessi per la creazione di Deployment
  resources: ["deployments"]
  verbs: ["create", "get", "update", "delete", "list", "watch"]
- apiGroups: [""] # Permessi per la creazione di Service
  resources: ["services"]
  verbs: ["create", "get", "update", "delete", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-master-deployment-creator
  namespace: dev # IMPORTANTE: Assicurati che sia il namespace corretto (dev)
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: master-node-deployment-creator # Riferimento al Role creato sopra
subjects:
- kind: ServiceAccount
  name: default # ServiceAccount predefinito usato dal Master Node nel namespace 'dev'
  namespace: dev
